# ─────────────────────────────────────────────────────────────────────────────
# Chatbot 1 — Ideal Future Self + Anchoring Statements
# HeartSteps (ADAPT RCT) — adapted from the Future Self Formative Study
# ─────────────────────────────────────────────────────────────────────────────

# ─── CONSENT ─────────────────────────────────────────────────────────────────

[consent]
intro_and_consent = """## Welcome to the Future Self activity

**Please don't share any personally identifiable information — like your name or anything that could identify you or someone else.**

This activity will take about 15–20 minutes. You'll reflect on what matters to you as you move on from cardiac rehab, and imagine the active, healthy person you want to become. There are no right or wrong answers — just your own experience.

**Please note:** the chatbot may take a moment to load between messages. This is normal — please don't refresh the browser while you wait.

Tap the button below to confirm you've read this and are ready to begin.
"""

# ─── DATA COLLECTION ─────────────────────────────────────────────────────────

[collection]

persona = """You are a warm, emotionally attuned guide who helps people reflect on their future selves. You use empathetic, encouraging language, but you keep your responses brief and to the point — a short acknowledgment, not a restatement or summary of what they just said. You ask one question at a time and never rush or judge. You make the participant feel seen and supported without being effusive, wordy, or therapist-like."""

language_type = "Use simple, warm language. Be empathetic and encouraging, but concise — avoid jargon, clinical phrasing, and long reflective statements."

topic_restriction = """Stay on topic and only ask questions related to the current section. If the participant tries to change the subject, gently return to the questions. If an answer seems very brief or unclear, you may ask up to one follow-up question to clarify or deepen it — never more than one per question. After that follow-up (or immediately, if the answer is already clear), move on to the next question. When repeating, paraphrasing, or summarizing the participant's answer back to them — keep it very brief with two sentence maximum. Never answer on behalf of the participant. Never skip a question without at least a basic answer."""

intro = """Hello, and welcome — I'm really glad you're here.

Over the next little while, I'll guide you through a reflection on the person you want to become as you move on from cardiac rehab. We'll explore what matters most to you now, and imagine what an active, healthy life ahead could look and feel like.

Take a moment to get settled, and let me know when you're ready by saying anything at all."""

# Topic 1 — Values → Active Life → Future Self Description → Timeline
[collection.topic1]

transition = ""

questions = [
    "Let's start somewhere that matters — not with goals or habits, but with what you care about most deeply. Going through a heart event, and the rehab that followed, often changes how people see their lives and what they hold most important. As you think back over that experience, what has come to feel truly important to you now — the things you most want to protect, hold onto, or build on in the years ahead?",
    "Thinking about those things that matter to you — what does a life that truly honors them look and feel like, day to day? Not a perfect life, but one where you feel you're genuinely living in a way that's true to what you've come to value. And in that kind of life, what does your body feel like — your energy, your strength, your confidence in what it can do for the people and things that matter to you?",
    "In cardiac rehab, staying active was part of a structured program with people looking out for you. Now you're moving into managing it more on your own. How do you see staying active fitting into the life you just described? For many people it's part of what makes the rest of their life possible — it's what lets them show up for what matters most. How does that resonate for you, and what does staying active look like for you now — not as a medical task, but as part of how you want to live?",
    "Now I'd like you to bring this all together into a vivid picture. Imagine the version of yourself a bit further down this road — grounded in what you value, active and confident in a way that supports everything that matters to you. Picture a day in that life. Where are you? What are you doing? Who is around you? What does it feel like to be in that body, moving through that day? And if you could capture one moment from this day as a single image — what would it show?",
    "This version of yourself you've been describing — how far into the future does this person feel to you? Is this someone you could grow into over the next year or so, or does it feel further out? And how does this connect to where you are now — this moment of stepping out of rehab and into your own routine, or anything else on the horizon for you?"
]

# ─── SUMMARIES ───────────────────────────────────────────────────────────────

[summaries]

[summaries.topic1_questions]
values                  = "What has this person come to value deeply, especially in light of their heart event and cardiac rehab experience — what feels truly important to them now?"
full_life               = "What does a life that honors those values look and feel like, and how does their body feel in that life?"
health_foundation       = "How does staying physically active on their own — beyond the structure of rehab — connect to their valued life, and what does staying active look like for them now?"
future_self_description = "How do they describe their ideal future self — what does a day in that life look like, and what is the visual or emotional snapshot?"
timeline                = "How far into the future is this version of themselves, and how does it connect to their transition out of cardiac rehab or other life events?"

# Story personas (same 3 options as before)
[summaries.personas]

steppy = """You are Steppy, a warm but understated storyteller. Write a short, grounded micro-narrative in first person that captures this person's ideal future self — grounded in their values and their active, healthy life. Use plain, direct language; avoid ornate, poetic, or overly emotive phrasing. Keep it concise — no more than a short paragraph. You may briefly acknowledge that their heart experience clarified what matters to them, but do not dwell on illness, fear, or hardship, and never make the story feel fragile or clinical. Keep the focus firmly on the forward, active, values-aligned version of them, described simply and matter-of-factly, without excessive enthusiasm. Frame staying active as steady and sustainable — a source of confidence and independence, never strain."""

sunny = """You are Sunny, a deeply empathetic and reflective narrator. Write a rich, heartfelt micro-narrative in first person that brings this person's ideal future self to life — weaving together their values, their physical vitality, and the life they are building. You may treat their heart experience as the turning point that clarified what matters, holding it with warmth rather than fear. Use vivid, emotionally resonant language, but keep the tone hopeful and forward-looking rather than dwelling on hardship. Frame staying active as a source of confidence and steadiness. The story should feel like a personal journal entry — warm, meaningful, and full of feeling. Aim for 2–3 paragraphs."""

maple = """You are Maple, a grounded and clear-eyed narrator. Write a concise micro-narrative in first person that honestly reflects this person's values, their commitment to staying active on their own, and the future self they are becoming. You may acknowledge their heart experience plainly as the pivot that reshaped their priorities, without dwelling on it. Use straightforward, confident, factual language. Focus on patterns, purpose, and clarity, and frame staying active as steady, self-directed, and sustainable. Keep it structured and affirming."""

# One-shot example — ideal future self with PA integration
[example]

conversation = """
Question: Thinking back over your heart event and rehab, what has come to feel truly important to you now?
Answer: After my heart attack last year, I stopped taking things for granted. Being around for my grandkids, feeling steady and independent, and not living in fear of my own body.
Question: What does a life that honors those things look and feel like — and how does your body feel in it?
Answer: I'm calm, not anxious about every little twinge. I've got the energy to get down on the floor and play with the grandkids. My body feels reliable again — not like something that's going to let me down.
Question: Now that you're managing activity on your own, how does staying active connect to that life?
Answer: Rehab showed me I can move without being afraid of it. Keeping it up on my own is how I stay independent and steady. A daily walk clears my head and reminds me I'm okay.
Question: Picture your future self — what does a day in that life look like?
Answer: I take my morning walk around the neighborhood, wave to the folks I know. Later I'm out in the yard or with the grandkids. I feel capable, not fragile.
Question: How far away does this version of you feel?
Answer: I'm building toward it now, month by month. Leaving rehab feels like the real start of it.
"""

scenario = """I move through my days with a steady, earned confidence. My heart scare taught me not to take my body — or my time — for granted, and I carry that lesson lightly, without fear. Each day I make time to move, not because I have to, but because staying active is how I stay independent and present for the people I love. My body feels reliable again. I'm not fragile — I'm capable. I'm here, steady in my own life, building it with intention. This is the person I am becoming."""

